<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07060d"/>
      <stop offset="0.6" stop-color="#1a0d1f"/>
      <stop offset="1" stop-color="#3a0f17"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9d6"/>
      <stop offset="0.7" stop-color="#f3b7a0"/>
      <stop offset="1" stop-color="#f3b7a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="rain" width="40" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="10" y1="0" x2="10" y2="22" stroke="#9fb4d8" stroke-opacity="0.18" stroke-width="1.2"/>
      <line x1="30" y1="40" x2="30" y2="58" stroke="#9fb4d8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="windows" width="22" height="28" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="8" height="10" fill="#ffcf70" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1584" height="396" fill="url(#sky)"/>
  <circle cx="1180" cy="120" r="130" fill="url(#moon)" opacity="0.35"/>
  <circle cx="1180" cy="120" r="62" fill="#f7d3bf" opacity="0.85"/>

  <!-- Far skyline -->
  <g fill="#120a17">
    <rect x="0" y="210" width="90" height="186"/><rect x="95" y="170" width="70" height="226"/>
    <rect x="170" y="230" width="110" height="166"/><rect x="290" y="150" width="60" height="246"/>
    <rect x="355" y="200" width="120" height="196"/><rect x="480" y="180" width="80" height="216"/>
    <rect x="570" y="230" width="140" height="166"/><rect x="720" y="160" width="70" height="236"/>
    <rect x="800" y="205" width="130" height="191"/><rect x="940" y="175" width="90" height="221"/>
    <rect x="1040" y="225" width="120" height="171"/><rect x="1170" y="190" width="80" height="206"/>
    <rect x="1260" y="150" width="70" height="246"/><rect x="1340" y="210" width="130" height="186"/>
    <rect x="1480" y="180" width="104" height="216"/>
  </g>
  <g fill="url(#windows)">
    <rect x="95" y="180" width="70" height="200"/><rect x="290" y="160" width="60" height="220"/>
    <rect x="720" y="170" width="70" height="210"/><rect x="1260" y="160" width="70" height="220"/>
    <rect x="940" y="185" width="90" height="200"/>
  </g>

  <!-- Near building / doorway (left-center, kept clear of profile photo area) -->
  <rect x="470" y="60" width="330" height="336" fill="#0b070e"/>
  <rect x="470" y="60" width="330" height="10" fill="#1f1320"/>
  <!-- door frame -->
  <rect x="560" y="150" width="150" height="246" fill="#1d0d12"/>
  <rect x="572" y="162" width="126" height="234" fill="#ff2a3d" opacity="0.18"/>
  <ellipse cx="635" cy="300" rx="190" ry="120" fill="url(#glow)"/>
  <!-- deadbolt lock on frame -->
  <g transform="translate(686 270)">
    <rect x="-9" y="-14" width="18" height="28" rx="3" fill="#c9a24a"/>
    <circle cx="0" cy="-3" r="4" fill="#2a1a0a"/><rect x="-1.5" y="-1" width="3" height="8" fill="#2a1a0a"/>
  </g>
  <!-- door sign -->
  <rect x="575" y="110" width="120" height="28" rx="3" fill="#120a0d" stroke="#ff2a3d" stroke-width="2" filter="url(#neon)"/>
  <text x="635" y="130" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#ff5a68" text-anchor="middle" letter-spacing="3">NO EXIT</text>

  <!-- Reaper silhouette in doorway -->
  <g fill="#050306">
    <path d="M635 175 c-24 0 -38 20 -38 44 c0 10 3 18 7 24 l-26 40 l-14 113 h142 l-14 -113 l-26 -40 c4 -6 7 -14 7 -24 c0 -24 -14 -44 -38 -44 z"/>
    <!-- scythe -->
    <rect x="690" y="150" width="6" height="246" transform="rotate(8 693 270)"/>
    <path d="M708 150 c-60 -18 -120 -4 -150 36 c40 -22 92 -24 140 -10 z" transform="rotate(8 693 270)"/>
  </g>
  <!-- glowing eyes -->
  <circle cx="626" cy="222" r="3" fill="#ff3446" filter="url(#neon)"/>
  <circle cx="644" cy="222" r="3" fill="#ff3446" filter="url(#neon)"/>

  <!-- Ground & reflection -->
  <rect x="0" y="378" width="1584" height="18" fill="#0a0609"/>
  <rect x="560" y="378" width="150" height="18" fill="#ff2a3d" opacity="0.25"/>

  <!-- Title -->
  <g filter="url(#neon)">
    <text x="1180" y="230" font-family="Impact, 'Arial Black', sans-serif" font-size="120" fill="#ff2a3d" text-anchor="middle" letter-spacing="10">DEADBOLT</text>
  </g>
  <text x="1180" y="230" font-family="Impact, 'Arial Black', sans-serif" font-size="120" fill="#ffd9dc" fill-opacity="0.35" text-anchor="middle" letter-spacing="10">DEADBOLT</text>
  <text x="1180" y="275" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#e8c9b8" text-anchor="middle" letter-spacing="8">STEALTH · SHADOWS · NO MERCY</text>
  <line x1="960" y1="300" x2="1400" y2="300" stroke="#ff2a3d" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Rain & vignette -->
  <rect width="1584" height="396" fill="url(#rain)"/>
  <rect width="1584" height="396" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="40"/>
</svg>
